<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資產自動化地圖｜Edward 1:1 諮詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="https://jonesgoober8433-lab.github.io/edward-blog/assets/brand/favicon-32.png">
<style>
/* 跟 Edward 的 Blog 同一套：咖啡棕＋米色（coffee） */
:root{--bg:#F6F0E6;--card:#FFFFFF;--ink:#2E2219;--mu:#75644F;--ln:#E8DCC8;--navy:#4A3426;--navy-2:#7A5530;--gold:#A9773F;--gold-soft:#F1E5D0;--hero-a:#3E2B1F;--hero-b:#6A4A30;--hero-accent:#E2C08D;--err:#B23B3B;
  --shadow:0 1px 2px rgba(62,43,31,.05),0 12px 28px -18px rgba(62,43,31,.35);
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC","Songti TC",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
body{font:16px/1.75 var(--sans);-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1,h2{font-family:var(--serif);letter-spacing:.02em;line-height:1.35}
/* 頂端列：同 Blog */
.site-header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.site-header .in{max-width:760px;margin:0 auto;padding:0 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand .mark{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;background:var(--hero-a)}
.brand .mark img{width:100%;height:100%;display:block}
.brand b{display:block;font:700 17px var(--serif);white-space:nowrap}
.brand small{display:block;color:var(--mu);font-size:12px;line-height:1.2;white-space:nowrap}
.back{flex:none;display:inline-flex;align-items:center;border:1px solid var(--ln);border-radius:10px;padding:6px 12px;color:var(--navy);font-weight:600;font-size:14px;text-decoration:none;background:var(--card)}
.back:hover{border-color:var(--gold)}
/* 開場：同 Blog 首頁 hero */
.hero{background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);color:#fff;padding:44px 0 40px}
.hero .in{max-width:760px;margin:0 auto;padding:0 16px}
.hero .rule{width:56px;height:3px;background:var(--hero-accent);margin-bottom:16px;border-radius:2px}
.tag{margin:0 0 6px;opacity:.75;letter-spacing:.3em;font-size:13px}
.hero h1{margin:0 0 12px;font-size:clamp(26px,5vw,38px)}
.hero p{margin:2px 0;opacity:.88;font-size:15.5px;max-width:640px}
.cta{display:inline-flex;align-items:center;justify-content:center;margin-top:22px;border:1px solid var(--gold);border-radius:10px;padding:12px 22px;font:700 16px var(--sans);color:#fff;background:var(--gold);cursor:pointer;animation:glow 2.4s ease-in-out infinite}
.cta:hover{filter:brightness(1.08)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(226,192,141,0)}50%{box-shadow:0 0 0 6px rgba(226,192,141,.25),0 0 22px 4px rgba(226,192,141,.45)}}
@media(prefers-reduced-motion:reduce){.cta{animation:none}}
/* 表單區：同 Blog 的 panel */
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
.formbox{background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--shadow);padding:8px;overflow:hidden}
.formbox iframe{width:100%;height:1500px;border:0;border-radius:10px;display:block;background:#fff}
.alt{text-align:center;font-size:14px;color:var(--mu);margin:10px 0 6px}.alt a{color:var(--navy-2);font-weight:600}
.foot{text-align:center;color:var(--mu);font-size:13px;margin-top:22px}
@media(max-width:600px){.hero{padding:32px 0 30px}.hero h1{font-size:26px}.hero p{font-size:14.5px}.cta{width:100%}.brand small{display:none}}
</style>
</head>
<body>
<header class="site-header"><div class="in">
  <a class="brand" href="https://jonesgoober8433-lab.github.io/edward-blog/"><span class="mark"><img src="https://jonesgoober8433-lab.github.io/edward-blog/assets/brand/mark-64.png" alt=""></span><span><b>Edward 的 Blog</b><small>保經事業部負責人｜CFC 財務教練</small></span></a>
  <a class="back" href="https://jonesgoober8433-lab.github.io/edward-blog/">← 回 Blog</a>
</div></header>
<section class="hero"><div class="in">
  <div class="rule"></div>
  <p class="tag">EDWARD 1:1 諮詢</p>
  <h1>訂製專屬的「資產自動化地圖」</h1>
  <p>你好，我是 Edward</p>
  <p>這份盤點表不聊投機明牌，只專注於幫你理清資產底層邏輯</p>
  <p>由於每週 1:1 諮詢名額有限，系統將優先篩選真正準備好面對自己財務現況的朋友</p>
  <button class="cta" type="button" onclick="document.getElementById('formbox').scrollIntoView({behavior:'smooth'})">✨ 開始填寫，預約 1:1 諮詢</button>
</div></section>
<div class="wrap">
  <section class="formbox" id="formbox">
    <iframe title="預約諮詢表單" src="https://docs.google.com/forms/d/e/1FAIpQLSehdMad5-KkAoZYLd29rQkWDhNoBJK2A7HniB-DaaABEtqLjg/viewform?embedded=true" loading="lazy">載入中…</iframe>
    <p class="alt">表單沒有顯示？<a href="https://docs.google.com/forms/d/e/1FAIpQLSehdMad5-KkAoZYLd29rQkWDhNoBJK2A7HniB-DaaABEtqLjg/viewform" target="_blank" rel="noopener">在新分頁開啟表單</a></p>
  </section>
  <div class="foot">所有個資皆保密</div>
</div>
</body>
</html>
