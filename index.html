<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資產自動化地圖｜Edward 1:1 諮詢</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2a2e;--mute:#6b777b;--line:#e4dfd6;--brand:#1f6f6a;--brand2:#2fa39b;--gold:#c8923a;--err:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#12191b;--card:#1b2427;--ink:#eef2f2;--mute:#97a5a8;--line:#2b373b;--brand:#37b3a9;--brand2:#5fd0c6;--gold:#e0ad5a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.7}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 80px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:600;font-size:15px;text-decoration:none;padding:6px 2px;margin-bottom:12px}
.back:hover{text-decoration:underline}
.backbtn{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none}
.hero{background:linear-gradient(135deg,#17504c,#1f6f6a 55%,#2fa39b);color:#fff;border-radius:20px;padding:32px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.tag{display:inline-block;font-size:13px;background:rgba(255,255,255,.18);padding:3px 12px;border-radius:99px;margin-bottom:12px}
.hero h1{margin:0 0 14px;font-size:26px;line-height:1.4}
.hero p{margin:4px 0;opacity:.92;font-size:15px}
.cta{display:block;width:100%;margin-top:24px;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#3a2a08;background:linear-gradient(135deg,#f3c46b,#e0a23c);cursor:pointer;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(243,196,107,.0),0 4px 14px rgba(0,0,0,.18)}50%{box-shadow:0 0 0 6px rgba(243,196,107,.28),0 0 26px 6px rgba(243,196,107,.55)}}
@media(prefers-reduced-motion:reduce){.cta{animation:none}}
form{margin-top:28px}
.sec{margin:30px 4px 12px;font-size:15px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:8px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;margin-bottom:14px;transition:border-color .2s}
.q.bad{border-color:var(--err)}
.q label.t,.q .t{display:block;font-weight:600;font-size:16px;white-space:pre-line;margin-bottom:12px}
.req{color:var(--err);margin-left:4px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:8px 2px;outline:0;transition:border-color .2s}
textarea{resize:vertical;min-height:84px;border:2px solid var(--line);border-radius:10px;padding:10px}
input:focus,textarea:focus,select:focus{border-color:var(--brand2)}
select{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;margin:6px 0;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;font-size:15px}
.opt:hover{border-color:var(--brand2)}
.opt:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt .other{flex:1;border:0;border-bottom:1.5px solid var(--line);padding:2px 4px}
.note{background:color-mix(in srgb,var(--gold) 14%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:16px;padding:16px 18px;margin:14px 0;font-size:15px}
.note b{display:block;margin-bottom:2px}
.err{color:var(--err);font-size:13px;margin-top:6px;display:none}
.q.bad .err{display:block}
.submit{width:100%;margin-top:18px;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;background:var(--brand);cursor:pointer}
.submit:disabled{opacity:.6}
.done{display:none;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:48px 24px;margin-top:28px}
.done h2{margin:8px 0}
.foot{text-align:center;color:var(--mute);font-size:13px;margin-top:26px}
.formbox{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;overflow:hidden}
.formbox iframe{width:100%;height:1500px;border:0;border-radius:14px;display:block;background:#fff}
.alt{text-align:center;font-size:14px;color:var(--mute);margin:10px 0 6px}.alt a{color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="https://jonesgoober8433-lab.github.io/edward-blog/">← 回到 Edward 的 Blog</a>
  <div class="hero">
    <span class="tag">Edward 1:1 諮詢</span>
    <h1>訂製專屬的「資產自動化地圖」</h1>
    <p>你好，我是 Edward</p>
    <p>這份盤點表不聊投機明牌，只專注於幫你理清資產底層邏輯</p>
    <p>由於每週 1:1 諮詢名額有限，系統將優先篩選真正準備好面對自己財務現況的朋友</p>
    <button class="cta" type="button" onclick="document.getElementById('formbox').scrollIntoView({behavior:'smooth'})">✨ 開始填寫，預約 1:1 諮詢</button>
  </div>

  <section class="formbox" id="formbox">
    <iframe title="預約諮詢表單" src="https://docs.google.com/forms/d/e/1FAIpQLSehdMad5-KkAoZYLd29rQkWDhNoBJK2A7HniB-DaaABEtqLjg/viewform?embedded=true" loading="lazy">載入中…</iframe>
    <p class="alt">表單沒有顯示？<a href="https://docs.google.com/forms/d/e/1FAIpQLSehdMad5-KkAoZYLd29rQkWDhNoBJK2A7HniB-DaaABEtqLjg/viewform" target="_blank" rel="noopener">在新分頁開啟表單</a></p>
  </section>
  <div class="foot">所有個資皆保密</div>
</div>
</body>
</html>
